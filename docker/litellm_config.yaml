litellm_settings:
  success_callback: [langfuse]
  failure_callback: [langfuse]
  drop_params: true
  num_retries: 0
  request_timeout: 5
  max_budget: 50
  budget_duration: 30d
  callbacks: [callbacks.language_router]
  default_tags: [llmops-in-a-box]

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - { "gpt-4o": [claude-sonnet] }
    - { "claude-sonnet": [gpt-4o] }
    - { "qwen-7b": [gpt-4o] }
    - { "auto": [claude-sonnet] }

mcp_servers:
  - server_name: "clickhouse"
    server_path_or_url: "http://mcp-clickhouse:9100/sse"
    transport: "sse"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
