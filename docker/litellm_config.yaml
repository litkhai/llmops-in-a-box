# GENERATED by scripts/stack.sh render — DO NOT EDIT. Edit stack.yaml and re-run `./scripts/stack.sh render`.
# profile: phase-1

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      tpm: 800000
      timeout: 5
    model_info:
      mode: chat
      max_input_tokens: 128000
      input_cost_per_token: 2.5e-06
      output_cost_per_token: 1e-05
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 500
      tpm: 400000
      timeout: 5
    model_info:
      mode: chat
      max_input_tokens: 200000
      input_cost_per_token: 3e-06
      output_cost_per_token: 1.5e-05
  - model_name: auto
    litellm_params:
      model: gpt-4o
    model_info:
      mode: chat
  - model_name: dall-e-3
    litellm_params:
      model: huggingface/black-forest-labs/FLUX.1-schnell
      api_key: os.environ/HF_TOKEN
      timeout: 90
    model_info:
      mode: image_generation
  - model_name: dall-e-3-cf
    litellm_params:
      model: cloudflare/@cf/black-forest-labs/flux-1-schnell
      api_key: os.environ/CF_API_TOKEN
      cf_account_id: os.environ/CF_ACCOUNT_ID
      timeout: 90
    model_info:
      mode: image_generation

litellm_settings:
  success_callback: [langfuse]
  failure_callback: [langfuse]
  drop_params: true
  num_retries: 0
  request_timeout: 5
  max_budget: 50
  budget_duration: 30d
  callbacks: [callbacks.language_router]

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - { "gpt-4o": [claude-sonnet] }
    - { "claude-sonnet": [gpt-4o] }
    - { "auto": [claude-sonnet] }
    - { "dall-e-3": [dall-e-3-cf] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
