litellm_settings:
  success_callback: []
  failure_callback: []
  drop_params: true
  num_retries: 0
  request_timeout: 30
  max_budget: 50
  budget_duration: 30d
  callbacks: [callbacks.language_router]
  default_tags: [llmops-in-a-box]

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - { "auto": [claude-sonnet] }

mcp_servers:
  clickhouse:
    url: "http://mcp-clickhouse:9100/sse"
    transport: "sse"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
