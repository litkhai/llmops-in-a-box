# profile: phase-2

model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 500
      tpm: 400000
      timeout: 30
    model_info:
      mode: chat
      max_input_tokens: 200000
      input_cost_per_token: 3e-06
      output_cost_per_token: 1.5e-05
  - model_name: auto
    litellm_params:
      model: qwen-7b
    model_info:
      mode: chat
  - model_name: dall-e-3
