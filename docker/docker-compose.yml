# ═════════════════════════════════════════════════════════════════════════════
#  Phase 1 — LiteLLM gateway + Langfuse observability + LibreChat
#
#  Invoked only through the control plane, never directly:
#
#      ./scripts/stack.sh up --target docker --profile phase-1
#
#  which resolves to roughly:
#
#      docker compose -f docker/docker-compose.yml -p sais --env-file .env \
#        --profile gateway --profile obs --profile ui up -d
#
#  Every service therefore declares a `profiles:` entry matching a layer's
#  `compose_profile` in stack.yaml. A service with no profile would start on
#  every invocation regardless of the selected phase, which would defeat the
#  point of the profiles.
#
#  Nine containers for three layers. stack.yaml's `observability.options.backends`
#  lists four supporting services; the two that surprised this build are:
#    • Langfuse v3 is TWO services — `langfuse-web` and `langfuse-worker`. The
#      worker does ingestion and batch work; without it traces are accepted and
#      never processed.
#    • LibreChat requires MongoDB. It is not optional and it is not Langfuse's
#      Postgres.
#
#  Secrets use ${VAR:?message} deliberately. An unset secret aborts `up` with a
#  named variable instead of starting a container that fails a health check five
#  minutes later for an unrelated-looking reason. Operational values that are not
#  secret use ${VAR:-default}.
# ═════════════════════════════════════════════════════════════════════════════

name: sais

x-langfuse-env: &langfuse-env
  # Shared by web and worker: both talk to all four backends, and Langfuse
  # requires the values to agree between them.
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run ./scripts/stack.sh secrets gen}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required — run ./scripts/stack.sh secrets gen}
  # 256-bit hex. `openssl rand -hex 32`. Encrypts stored provider credentials
  # and API keys inside Langfuse, so losing it makes existing rows unreadable.
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required — 64 hex chars, openssl rand -hex 32}
  # Optional. Blank keeps Langfuse on the OSS feature set.
  LANGFUSE_EE_LICENSE_KEY: ${LANGFUSE_EE_LICENSE_KEY:-}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_MIGRATION_V4_WRITE_MODE: "dual"

  CLICKHOUSE_URL: https://${CLICKHOUSE_CLOUD_HOST:?CLICKHOUSE_CLOUD_HOST required — run ./scripts/stack.sh secrets setup --phase 1}:8443
  CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_CLOUD_HOST}:9440?secure=true&skip_verify=false
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?LANGFUSE_CLICKHOUSE_USER required — run ./scripts/stack.sh secrets setup --phase 1}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD required — run ./scripts/stack.sh secrets setup --phase 1}
  CLICKHOUSE_DB: llmops
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH is required — run ./scripts/stack.sh secrets gen}
  REDIS_TLS_ENABLED: "false"

  # Event and batch-export uploads are server-to-server, so they use the
  # in-network endpoint. FORCE_PATH_STYLE is required for MinIO.
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — run ./scripts/stack.sh secrets gen}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

  LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_REGION: auto
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"

  # SMTP — required for invitation emails and password resets.
  # Leave EMAIL_HOST blank to disable email (invites won't be sent).
  EMAIL_HOST: ${LANGFUSE_EMAIL_HOST:-}
  EMAIL_PORT: ${LANGFUSE_EMAIL_PORT:-465}
  EMAIL_USERNAME: ${LANGFUSE_EMAIL_USER:-}
  EMAIL_PASSWORD: ${LANGFUSE_EMAIL_PASSWORD:-}
  EMAIL_FROM_ADDRESS: ${LANGFUSE_EMAIL_FROM:-}
  EMAIL_FROM_NAME: ${LANGFUSE_EMAIL_FROM_NAME:-LLMOps in a Box}

  # Media is fetched by the BROWSER, not by Langfuse, so this one must be the
  # host-published address rather than the in-network one. Getting this wrong
  # produces a UI that loads but shows broken attachments.
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  # Follows MINIO_API_PORT, because if that port is remapped to dodge a
  # collision the browser has to be told the new one.
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9002}}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

x-backend-deps: &backend-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:

  # ══ obs — the observability layer and its four backends ═══════════════════

  postgres:
    image: postgres:16-alpine
    profiles: [obs]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    # Not published. Nothing outside the compose network needs it, and 5432 is
    # one of the most likely ports on a developer machine to be already taken.
    # `docker compose exec postgres psql -U "$POSTGRES_USER"` when you need a shell.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate `litellm` database on first init. Only runs when
      # the volume is empty — see docker/postgres-init/01-litellm-db.sql.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # 7.2 is what the v4 guide recommends. Pinned to the minor rather than `7`
    # so a future 7.x does not arrive unannounced on a `docker compose pull`.
    image: redis:${REDIS_IMAGE_TAG:-7.2-alpine}
    profiles: [obs]
    restart: unless-stopped
    # Password on the command line is visible to `docker inspect`, which is no
    # worse than the environment, and Langfuse requires REDIS_AUTH to match.
    command: >-
      redis-server --requirepass ${REDIS_AUTH:?REDIS_AUTH is required}
      --maxmemory-policy noeviction
    # Not published, same reasoning as postgres: in-network only, and 6379 is
    # very often already in use.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH is required}

  minio:
    image: minio/minio:latest
    profiles: [obs]
    restart: unless-stopped
    # MinIO creates a bucket from a directory, so pre-creating `langfuse` here
    # avoids a separate one-shot `mc` container just to make one bucket.
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      # 9002 on the host, not 9000 — avoids collisions with other services;
      # stack.yaml declares this pair as { api: 9002, console: 9001 }.
      - "0.0.0.0:${MINIO_API_PORT:-9002}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── Langfuse v4 ──────────────────────────────────────────────────────────
  #
  #  Pinned to v4 by decision. Note what that means today: v4 is published only
  #  as release candidates — 4.0.0-rc.0 … rc.2 — while the stable tags remain
  #  `3` and `latest`. Recorded here so the choice stays visible rather than
  #  being discovered later by someone reading the tag.
  #
  #  v4 changes the data model, not the deployment. One Observations view
  #  replaces the separate traces/observations tabs, and trace_id becomes an
  #  ordinary filter column. The infrastructure is identical to v3: web +
  #  worker + Postgres + ClickHouse + Redis + S3, every one of them mandatory.
  #
  #  LANGFUSE_MIGRATION_V4_WRITE_MODE is set to "dual" below. The v4 RC
  #  defaults to "events_only", which rejects SDK v2 trace-create events from
  #  LiteLLM. "dual" writes to both the legacy and the new v4 event path, so
  #  SDK v2 trace-create is accepted while the worker's OTEL_BEHAVIOUR=direct
  #  (default for fresh installs) stays compatible. Valid values are
  #  "legacy" | "dual" | "events_only"; "legacy" crashes the worker.
  #  Remove this override once LiteLLM upgrades to SDK v3.
  langfuse-worker:
    image: langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4.0.0-rc.2}
    profiles: [obs]
    restart: unless-stopped
    depends_on: *backend-deps
    environment:
      <<: *langfuse-env
    # Not published: nothing on the host talks to the worker. It does answer
    # /api/health on 3030 though, so compose can still tell live from wedged —
    # without this the worker reported a bare "Up" whatever state it was in.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname -i):3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  langfuse-web:
    image: langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4.0.0-rc.2}
    profiles: [obs]
    restart: unless-stopped
    depends_on: *backend-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — run ./scripts/stack.sh secrets gen}
      # Headless initialization — creates the org, project, user and the API key
      # pair on first boot if they do not already exist, so the gateway can be
      # configured with keys that are known in advance. Without this, the
      # Langfuse keys cannot exist until after Langfuse is running, and the
      # gateway starts with tracing silently disabled.
      # https://langfuse.com/self-hosting/administration/headless-initialization
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-llmops-in-a-box}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-sovereign-ai-stack}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Sovereign AI Stack}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "0.0.0.0:${LANGFUSE_PORT:-3000}:3000"
    healthcheck:
      # Not 127.0.0.1, and not localhost. Langfuse binds only its container
      # IP — verified: netstat inside shows 172.x.x.x:3000 and every loopback
      # address is refused, while the published port works fine from the host.
      # `$$(hostname -i)` resolves to that address at runtime; the `$$` keeps
      # Compose from trying to interpolate it.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname -i):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ══ gateway — LiteLLM ════════════════════════════════════════════════════

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [gateway]
    restart: unless-stopped
    # Service name is load-bearing: docker/librechat.yaml is rendered with
    # baseURL http://litellm:4000/v1. Renaming this breaks the UI silently.
    #
    # No depends_on. It would have to name `postgres`, which lives in the `obs`
    # profile, and Compose rejects a dependency on a service outside the active
    # profile set — `--profile gateway` alone then fails with "depends on
    # undefined service postgres". Every stack.yaml profile that includes
    # gateway happens to include observability too, so it would have worked
    # through the control plane and broken for anyone running compose directly.
    #
    # `restart: unless-stopped` covers the ordering instead: if Postgres is not
    # up yet, LiteLLM exits and is restarted until it is.
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required — run ./scripts/stack.sh secrets gen}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required — run ./scripts/stack.sh secrets gen}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD is required — run ./scripts/stack.sh secrets setup}
      # Without a database LiteLLM still proxies, but virtual keys and the
      # declared budget cap (layers.gateway.options.budget) are not persisted
      # or enforced. Separate database on the same server; created by
      # postgres-init on first boot.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/litellm
      STORE_MODEL_IN_DB: ${LITELLM_STORE_MODEL_IN_DB:-True}

      # Provider keys. Deliberately NOT `:?` — a missing provider key should
      # degrade to "that model fails at request time", which `doctor` and
      # `render` both warn about, rather than refusing to start the gateway.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Tracing. LANGFUSE_HOST is the in-network address, not localhost:3000 —
      # this call is container-to-container.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LITELLM_LANGFUSE_HOST:-http://langfuse-web:3000}

      # Image generation — Cloudflare Workers AI (optional; leave blank to disable).
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}

      # Image storage — generated images are uploaded to MinIO so LibreChat
      # can render them via a URL instead of an inline base64 data URI.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-}
    volumes:
      # Generated by `stack.sh render` from the stack.yaml model catalog.
      - ./litellm_config.yaml:/app/config.yaml:ro
      # Language-routing callback — routes non-Latin requests to claude-sonnet,
      # Latin/English requests to gpt-4o. Referenced in litellm_config.yaml.
      - ./litellm_callbacks.py:/app/callbacks.py:ro
    ports:
      - "0.0.0.0:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://0.0.0.0:4000/health/liveliness').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ══ ui — LibreChat and its MongoDB ═══════════════════════════════════════

  mongo:
    image: mongo:7
    profiles: [ui]
    restart: unless-stopped
    # WiredTiger's cache defaults to (RAM / 2 - 1 GB), sized against the Docker
    # VM. On a 16 GB machine that reserves several gigabytes to store what is,
    # here, a handful of chat threads. 0.5 GB is ample.
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.5}"]
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    # Not published to the host. Nothing outside the compose network needs it,
    # and an unauthenticated MongoDB on a laptop port is a poor default.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    profiles: [ui]
    restart: unless-stopped
    # Only mongo, which is in this same profile. LiteLLM is deliberately not a
    # dependency: it is in another profile, and LibreChat does not call the
    # gateway at boot — only per request.
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongo:27017/LibreChat
      # Required for app startup, per LibreChat's docs:
      #   CREDS_KEY  32-byte key, 64 hex chars
      #   CREDS_IV   16-byte IV,  32 hex chars
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?LIBRECHAT_CREDS_KEY is required — 64 hex chars, openssl rand -hex 32}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?LIBRECHAT_CREDS_IV is required — 32 hex chars, openssl rand -hex 16}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?LIBRECHAT_JWT_SECRET is required — 64 hex chars, openssl rand -hex 32}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?LIBRECHAT_JWT_REFRESH_SECRET is required — 64 hex chars, openssl rand -hex 32}
      # librechat.yaml interpolates this for the custom endpoint's apiKey, so
      # the UI authenticates to the gateway with the same master key.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      CONFIG_PATH: /app/librechat.yaml
      # Meilisearch is bundled in LibreChat's own compose file. Not included
      # here: it is a tenth container for conversation search, which is not
      # part of what Phase 1 demonstrates.
      SEARCH: ${LIBRECHAT_SEARCH:-false}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-true}
      ALLOWED_EMAIL_DOMAINS: ${LIBRECHAT_ALLOWED_EMAIL_DOMAINS:-}
      # Route LibreChat's image generation through LiteLLM so HF/CF fallback
      # is transparent. LibreChat requests dall-e-3; LiteLLM maps it to FLUX.
      DALLE_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      DALLE3_BASE_URL: http://litellm:4000
    volumes:
      # Generated by `stack.sh render` from the same model catalog as the
      # gateway config, so the picker cannot drift from what LiteLLM serves.
      - ./librechat.yaml:/app/librechat.yaml:ro
    ports:
      - "0.0.0.0:${LIBRECHAT_PORT:-3080}:3080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ══ tools — MCP server layer (Phase 2) ═══════════════════════════════════════
  #
  # Exposes the ClickHouse Cloud schema and query tools to LibreChat Agents
  # via the Model Context Protocol (SSE transport). Start with --profile tools
  # or use `./scripts/stack.sh up --profile phase-2`.

  mcp-clickhouse:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    profiles: [tools]
    restart: unless-stopped
    environment:
      # mcp-clickhouse reads these env vars to connect to ClickHouse Cloud.
      # Use :- (not :?) so Phase 1 profiles can start without Phase 2 MCP credentials.
      # The container itself will fail at runtime if credentials are missing — that is fine;
      # it only starts under the `tools` profile which is Phase 2+.
      CLICKHOUSE_HOST: ${CLICKHOUSE_CLOUD_HOST:-}
      CLICKHOUSE_USER: ${CLICKHOUSE_CLOUD_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_CLOUD_PASSWORD:-}
      CLICKHOUSE_SECURE: "true"
      CLICKHOUSE_VERIFY: "true"
    ports:
      - "0.0.0.0:9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://0.0.0.0:9100/sse',timeout=3); sys.exit(0 if r.status in (200,405) else 1)\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Caddy reverse proxy (aws-ec2 only) ───────────────────────────────────────
  #
  # Launched separately via `--profile proxy` after the core stack is up.
  # Obtains and auto-renews TLS certificates from Let's Encrypt.
  # Caddyfile is generated by `./scripts/stack.sh render --target aws-ec2`.
  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  mongo-data:
  caddy-data:
  caddy-config:
