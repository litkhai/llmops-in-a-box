<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="LLMOPS In a Box">
  <!-- Same 3-2-1 net as the favicon, in currentColor so it follows the
       palette. No plate — the header supplies the dark surface — so the mark
       is scaled ~8% larger to use the room the plate's padding would take.
       Heavier strokes than a plain scale-up would give: at the header's 24px
       the edges are the first thing to disappear, and without them the mark
       reads as scattered dots rather than a network. -->
  <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M5.1 6.5  L15.7 11.0"/><path d="M5.1 6.5  L15.7 21.0"/>
    <path d="M5.1 16   L15.7 11.0"/><path d="M5.1 16   L15.7 21.0"/>
    <path d="M5.1 25.5 L15.7 11.0"/><path d="M5.1 25.5 L15.7 21.0"/>
    <path d="M15.7 11.0 L25.7 16"/><path d="M15.7 21.0 L25.7 16"/>
  </g>

  <g fill="currentColor">
    <circle cx="5.1"  cy="6.5"  r="2.8"/>
    <circle cx="5.1"  cy="16"   r="2.8"/>
    <circle cx="5.1"  cy="25.5" r="2.8"/>
    <circle cx="15.7" cy="11.0" r="2.8"/>
    <circle cx="15.7" cy="21.0" r="2.8"/>
    <circle cx="25.7" cy="16"   r="3.9"/>
  </g>
</svg>
