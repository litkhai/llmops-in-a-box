# ═════════════════════════════════════════════════════════════════════════════
#  Credential inventory — TEMPLATE
# ═════════════════════════════════════════════════════════════════════════════
#
#      cp secrets/credentials.example.yaml secrets/credentials.yaml
#      $EDITOR secrets/credentials.yaml
#      ./scripts/stack.sh secrets write     # -> generates .env
#
#  THIS file (credentials.example.yaml) is committed and must stay value-free.
#  credentials.yaml is ignored by git, Docker, and every AI coding tool
#  configured in this repo. Verify before every commit:
#
#      ./scripts/stack.sh secrets audit
#
#  One credential per entry. `env` is the variable name the stack reads —
#  it must match the names in stack.yaml `secrets:`. Everything else
#  (console, scopes, owner, rotates) is inventory metadata for audits.
# ═════════════════════════════════════════════════════════════════════════════

meta:
  project: sovereign-ai-stack
  # Bump when you rotate anything, so `secrets audit` can flag staleness.
  last_reviewed: 2026-07-26
  owner: ken.lee@clickhouse.com

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 1 — frontier model providers
# ─────────────────────────────────────────────────────────────────────────────
credentials:

  - name: OpenAI API key
    phase: 1
    env: OPENAI_API_KEY
    value: ""
    console: https://platform.openai.com/api-keys
    scopes: [model.request]
    notes: >-
      Project-scoped key preferred over a user key. Set a monthly usage limit
      in the OpenAI console — LiteLLM's max_budget is a soft guard, not a cap
      enforced by the provider.
    owner: ""
    rotates: 90d

  - name: Anthropic API key
    phase: 1
    env: ANTHROPIC_API_KEY
    value: ""
    console: https://console.anthropic.com/settings/keys
    scopes: [model.request]
    notes: >-
      Workspace-scoped key. LiteLLM handles the OpenAI→Anthropic format
      translation, so no separate SDK config is needed.
    owner: ""
    rotates: 90d

  # ── Gateway ──
  - name: LiteLLM master key
    phase: 1
    env: LITELLM_MASTER_KEY
    value: ""
    console: self-generated
    generate: "openssl rand -hex 24 | sed 's/^/sk-/'"
    notes: >-
      REQUIRED. Must start with `sk-`. This is the only credential clients
      need — it fronts every provider key above. Treat it as the crown jewel:
      leaking it exposes all downstream spend.
    owner: ""
    rotates: 90d

  - name: LiteLLM salt key
    phase: 1
    env: LITELLM_SALT_KEY
    value: ""
    console: self-generated
    generate: "openssl rand -hex 32"
    notes: >-
      Encrypts provider keys stored in LiteLLM's DB. Changing it invalidates
      every stored virtual key — set once, then leave alone.
    owner: ""
    rotates: never

  # ── Observability ──
  - name: Langfuse public key
    phase: 1
    env: LANGFUSE_PUBLIC_KEY
    value: ""
    console: http://localhost:3000 → Settings → API Keys
    notes: Blank on first boot; create the org/project in the UI, then fill in.
    owner: ""
    rotates: 180d

  - name: Langfuse secret key
    phase: 1
    env: LANGFUSE_SECRET_KEY
    value: ""
    console: http://localhost:3000 → Settings → API Keys
    notes: Pairs with the public key above. LiteLLM's callback needs both.
    owner: ""
    rotates: 180d

  - name: Langfuse NextAuth secret
    phase: 1
    env: NEXTAUTH_SECRET
    value: ""
    console: self-generated
    generate: "openssl rand -base64 32"
    notes: Session signing for the Langfuse UI.
    owner: ""
    rotates: never

  - name: Langfuse salt
    phase: 1
    env: LANGFUSE_SALT
    value: ""
    console: self-generated
    generate: "openssl rand -base64 32"
    notes: Hashes API keys at rest in Langfuse. Changing it invalidates them.
    owner: ""
    rotates: never

  # ── Langfuse backing services (internal to the compose network) ──
  - name: ClickHouse password (local)
    phase: 1
    env: CLICKHOUSE_PASSWORD
    value: ""
    console: self-generated
    generate: "openssl rand -hex 16"
    notes: >-
      Langfuse's local OLAP store. Not exposed publicly under the default
      security group, but change it anyway before any shared deploy.
    owner: ""
    rotates: 180d

  - name: Postgres password (local)
    phase: 1
    env: POSTGRES_PASSWORD
    value: ""
    console: self-generated
    generate: "openssl rand -hex 16"
    notes: Langfuse metadata store.
    owner: ""
    rotates: 180d

  - name: MinIO root user (Langfuse blob store)
    phase: 1
    env: MINIO_ROOT_USER
    value: "minio"
    console: self-generated
    notes: Langfuse event-upload bucket. Distinct from the Phase 4 artifact store.
    owner: ""
    rotates: never

  - name: MinIO root password (Langfuse blob store)
    phase: 1
    env: MINIO_ROOT_PASSWORD
    value: ""
    console: self-generated
    generate: "openssl rand -hex 16"
    notes: Minimum 8 characters or MinIO refuses to start.
    owner: ""
    rotates: 180d

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 2 — MCP tool layer (ClickHouse Cloud)
# ─────────────────────────────────────────────────────────────────────────────

  - name: ClickHouse Cloud host
    phase: 2
    env: CLICKHOUSE_CLOUD_HOST
    value: ""
    console: https://clickhouse.cloud → service → Connect
    notes: "Format: <service-id>.<region>.aws.clickhouse.cloud (port 8443, HTTPS)."
    owner: ""
    rotates: never

  - name: ClickHouse Cloud user
    phase: 2
    env: CLICKHOUSE_CLOUD_USER
    value: ""
    console: https://clickhouse.cloud → service → Settings → Users
    scopes: [SELECT]
    notes: >-
      Create a dedicated READ-ONLY user for the MCP server. An agent with a
      tool has the user's full grants — do not reuse the admin account.
    owner: ""
    rotates: 90d

  - name: ClickHouse Cloud password
    phase: 2
    env: CLICKHOUSE_CLOUD_PASSWORD
    value: ""
    console: https://clickhouse.cloud → service → Settings → Users
    notes: Shown once at user creation. Pairs with the user above.
    owner: ""
    rotates: 90d

  - name: MCP ClickHouse server URL
    phase: 2
    env: MCP_CLICKHOUSE_URL
    value: ""
    console: self-hosted
    notes: SSE endpoint of the MCP server, e.g. http://mcp-clickhouse:9100/sse
    owner: ""
    rotates: never

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 3 — self-hosted serving (RunPod) and cloud compute (AWS)
# ─────────────────────────────────────────────────────────────────────────────

  - name: RunPod API key
    phase: 3
    env: RUNPOD_API_KEY
    value: ""
    console: https://www.runpod.io/console/user/settings → API Keys
    scopes: [pod.read, pod.write]
    notes: >-
      Only needed to create/stop pods programmatically. Deploying by hand in
      the console requires no key at all.
    owner: ""
    rotates: 90d

  - name: vLLM endpoint (RunPod proxy)
    phase: 3
    env: VLLM_API_BASE
    value: ""
    console: https://www.runpod.io/console/pods → pod → Connect
    notes: >-
      Must include the /v1 suffix:
      https://<pod-id>-8000.proxy.runpod.net/v1
      Changes every time the pod is recreated.
    owner: ""
    rotates: per-pod

  - name: vLLM API key
    phase: 3
    env: VLLM_API_KEY
    value: ""
    console: self-generated
    generate: "openssl rand -hex 24"
    notes: >-
      Passed to `vllm serve --api-key`. The RunPod HTTP proxy is public by
      default, so an unauthenticated pod is an open GPU to the internet.
      Always set this.
    owner: ""
    rotates: per-pod

  - name: Hugging Face token
    phase: 3
    env: HF_TOKEN
    value: ""
    console: https://huggingface.co/settings/tokens
    scopes: [read]
    notes: >-
      Only required for gated weights (Llama, some EXAONE variants).
      Qwen2.5 is open and needs no token.
    owner: ""
    rotates: 180d

  # ── AWS (target: aws-ec2) ──
  #  PREFER IAM Identity Center / SSO or an instance profile over static keys.
  #  Set AWS_PROFILE and leave the two static keys blank if you can.
  - name: AWS profile
    phase: 3
    env: AWS_PROFILE
    value: ""
    console: "aws configure sso"
    notes: >-
      The safe path. If this is set, leave AWS_ACCESS_KEY_ID and
      AWS_SECRET_ACCESS_KEY blank — Terraform picks up the profile.
    owner: ""
    rotates: n/a

  - name: AWS access key ID
    phase: 3
    env: AWS_ACCESS_KEY_ID
    value: ""
    console: https://console.aws.amazon.com/iam → Users → Security credentials
    notes: >-
      Static long-lived credential — least preferred. Use only if SSO is
      unavailable. Scope the IAM user to EC2/VPC/EIP for this project alone.
    owner: ""
    rotates: 90d

  - name: AWS secret access key
    phase: 3
    env: AWS_SECRET_ACCESS_KEY
    value: ""
    console: https://console.aws.amazon.com/iam → Users → Security credentials
    notes: Shown once at creation. Pairs with the access key ID above.
    owner: ""
    rotates: 90d

  - name: AWS region
    phase: 3
    env: AWS_REGION
    value: "ap-northeast-2"
    console: n/a
    notes: Must match targets.aws-ec2.vars.region in stack.yaml.
    owner: ""
    rotates: never

  - name: AWS EC2 key pair name
    phase: 3
    env: AWS_KEY_NAME
    value: ""
    console: https://console.aws.amazon.com/ec2 → Key Pairs
    notes: >-
      Name only, not the .pem contents. Keep the private key outside this
      repo entirely (~/.ssh/). Passed as --tf-var key_name=<name>.
    owner: ""
    rotates: never

  - name: Allowed inbound CIDR
    phase: 3
    env: AWS_ALLOWED_CIDR
    value: ""
    console: n/a
    notes: >-
      Your IP as <ip>/32. NEVER 0.0.0.0/0 — this stack holds live provider
      keys behind unauthenticated-by-default ports.
    owner: ""
    rotates: as-needed

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 4 — artifact storage and memory
# ─────────────────────────────────────────────────────────────────────────────

  - name: Artifact MinIO root user
    phase: 4
    env: ARTIFACT_MINIO_ROOT_USER
    value: ""
    console: self-generated
    notes: Separate instance from the Langfuse blob store (ports 9011/9012).
    owner: ""
    rotates: never

  - name: Artifact MinIO root password
    phase: 4
    env: ARTIFACT_MINIO_ROOT_PASSWORD
    value: ""
    console: self-generated
    generate: "openssl rand -hex 16"
    notes: Datasets, eval artifacts, model weights.
    owner: ""
    rotates: 180d
