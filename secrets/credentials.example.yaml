# ═════════════════════════════════════════════════════════════════════════════
#  Credential inventory — TEMPLATE
# ═════════════════════════════════════════════════════════════════════════════
#
#      ./scripts/stack.sh secrets init
#      ./scripts/stack.sh secrets setup     # configure by technology
#        d                                  # default ID/email/password
#        g                                  # generate remaining internal values
#        w                                  # write .env
#
#  THIS file (credentials.example.yaml) is committed and must stay value-free.
#  credentials.yaml is ignored by git, Docker, and every AI coding tool
#  configured in this repo. Verify before every commit:
#
#      ./scripts/stack.sh secrets audit
#
#  One credential per entry. `env` is the variable name the stack reads —
#  it must match the names in stack.yaml `secrets:`. Everything else
#  (console, scopes, owner, rotates) is inventory metadata for audits.
# ═════════════════════════════════════════════════════════════════════════════

meta:
  project: sovereign-ai-stack
  # Bump when you rotate anything, so `secrets audit` can flag staleness.
  last_reviewed: 2026-07-26
  owner: ken.lee@clickhouse.com

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 1 — frontier model providers
# ─────────────────────────────────────────────────────────────────────────────
credentials:

  - name: OpenAI API key
    phase: 1
    env: OPENAI_API_KEY
    value: ""
    console: https://platform.openai.com/api-keys
    scopes: [model.request]
    notes: >-
      Project-scoped key preferred over a user key. Set a monthly usage limit
      in the OpenAI console — LiteLLM's max_budget is a soft guard, not a cap
      enforced by the provider.
    owner: ""
    rotates: 90d

  - name: Anthropic API key
    phase: 1
    env: ANTHROPIC_API_KEY
    value: ""
    console: https://console.anthropic.com/settings/keys
    scopes: [model.request]
    notes: >-
      Workspace-scoped key. LiteLLM handles the OpenAI→Anthropic format
      translation, so no separate SDK config is needed.
    owner: ""
    rotates: 90d

  # ── Gateway ──
  - name: LiteLLM master key
    phase: 1
    env: LITELLM_MASTER_KEY
    value: ""
    console: self-generated
    generate: sk-hex-24
    notes: >-
      REQUIRED. Must start with `sk-`. This is the only credential clients
      need — it fronts every provider key above. Treat it as the crown jewel:
      leaking it exposes all downstream spend.
    owner: ""
    rotates: 90d

  - name: LiteLLM salt key
    phase: 1
    env: LITELLM_SALT_KEY
    value: ""
    console: self-generated
    generate: hex-32
    notes: >-
      Encrypts provider keys stored in LiteLLM's DB. Changing it invalidates
      every stored virtual key — set once, then leave alone.
    owner: ""
    rotates: never

  - name: LiteLLM UI username
    phase: 1
    env: UI_USERNAME
    value: "admin"
    input: default
    default_credential: id
    console: self-hosted
    notes: Login ID for the LiteLLM admin UI.
    owner: ""
    rotates: never

  - name: LiteLLM UI password
    phase: 1
    env: UI_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Login password for the LiteLLM admin UI.
    owner: ""
    rotates: 180d

  # ── Observability ──
  - name: Langfuse public key
    phase: 1
    env: LANGFUSE_PUBLIC_KEY
    value: ""
    console: self-generated
    generate: lf-pk-hex-16
    notes: Used by headless initialization to create the demo project on first boot.
    owner: ""
    rotates: 180d

  - name: Langfuse secret key
    phase: 1
    env: LANGFUSE_SECRET_KEY
    value: ""
    console: self-generated
    generate: lf-sk-hex-24
    notes: Pairs with the public key above. LiteLLM's callback needs both.
    owner: ""
    rotates: 180d

  - name: Langfuse Enterprise license key
    phase: 1
    env: LANGFUSE_EE_LICENSE_KEY
    value: ""
    required: false
    console: https://langfuse.com/self-hosting/license-key
    scopes: [enterprise.features]
    notes: Optional. Leave blank to run the OSS feature set.
    owner: ""
    rotates: contract

  - name: Langfuse initial user name
    phase: 1
    env: LANGFUSE_INIT_USER_NAME
    value: ""
    input: config
    console: self-hosted
    notes: Display name for the account created by headless initialization.
    owner: ""
    rotates: never

  - name: Langfuse initial user email
    phase: 1
    env: LANGFUSE_INIT_USER_EMAIL
    value: ""
    input: config
    default_credential: email
    console: self-hosted
    notes: >-
      Login email for headless initialization. Kept separate from the common
      ID because Langfuse requires an email address.
    owner: ""
    rotates: never

  - name: Langfuse initial user password
    phase: 1
    env: LANGFUSE_INIT_USER_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Password for the initial Langfuse login account.
    owner: ""
    rotates: 180d

  - name: Langfuse NextAuth secret
    phase: 1
    env: NEXTAUTH_SECRET
    value: ""
    console: self-generated
    generate: base64-32
    notes: Session signing for the Langfuse UI.
    owner: ""
    rotates: never

  - name: Langfuse salt
    phase: 1
    env: LANGFUSE_SALT
    value: ""
    console: self-generated
    generate: base64-32
    notes: Hashes API keys at rest in Langfuse. Changing it invalidates them.
    owner: ""
    rotates: never

  - name: Langfuse encryption key
    phase: 1
    env: LANGFUSE_ENCRYPTION_KEY
    value: ""
    console: self-generated
    generate: hex-32
    notes: Encrypts provider credentials stored by Langfuse.
    owner: ""
    rotates: never

  - name: Redis authentication password
    phase: 1
    env: REDIS_AUTH
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Shared by the bundled Redis server and Langfuse.
    owner: ""
    rotates: never

  # ── Langfuse backing services (internal to the compose network) ──
  - name: ClickHouse password (local)
    phase: 1
    env: CLICKHOUSE_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: >-
      Langfuse's local OLAP store. Not exposed publicly under the default
      security group, but change it anyway before any shared deploy.
    owner: ""
    rotates: 180d

  - name: ClickHouse user (local)
    phase: 1
    env: CLICKHOUSE_USER
    value: "clickhouse"
    input: default
    default_credential: id
    console: self-hosted
    notes: Local ClickHouse account used by Langfuse.
    owner: ""
    rotates: never

  - name: Postgres user (local)
    phase: 1
    env: POSTGRES_USER
    value: "postgres"
    input: default
    default_credential: id
    console: self-hosted
    notes: Local PostgreSQL account shared by Langfuse and LiteLLM.
    owner: ""
    rotates: never

  - name: Postgres password (local)
    phase: 1
    env: POSTGRES_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Langfuse metadata store.
    owner: ""
    rotates: 180d

  - name: MinIO root user (Langfuse blob store)
    phase: 1
    env: MINIO_ROOT_USER
    value: "minio"
    input: default
    default_credential: id
    console: self-generated
    notes: Langfuse event-upload bucket. Distinct from the Phase 4 artifact store.
    owner: ""
    rotates: never

  - name: MinIO root password (Langfuse blob store)
    phase: 1
    env: MINIO_ROOT_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Minimum 8 characters or MinIO refuses to start.
    owner: ""
    rotates: 180d

  # ── LibreChat ──
  - name: LibreChat credentials encryption key
    phase: 1
    env: LIBRECHAT_CREDS_KEY
    value: ""
    console: self-generated
    generate: hex-32
    notes: 32-byte key used to encrypt stored endpoint credentials.
    owner: ""
    rotates: never

  - name: LibreChat credentials IV
    phase: 1
    env: LIBRECHAT_CREDS_IV
    value: ""
    console: self-generated
    generate: hex-16
    notes: 16-byte initialization vector paired with LIBRECHAT_CREDS_KEY.
    owner: ""
    rotates: never

  - name: LibreChat JWT secret
    phase: 1
    env: LIBRECHAT_JWT_SECRET
    value: ""
    console: self-generated
    generate: hex-32
    notes: Signs LibreChat access tokens.
    owner: ""
    rotates: never

  - name: LibreChat JWT refresh secret
    phase: 1
    env: LIBRECHAT_JWT_REFRESH_SECRET
    value: ""
    console: self-generated
    generate: hex-32
    notes: Signs LibreChat refresh tokens.
    owner: ""
    rotates: never

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 2 — MCP tool layer (ClickHouse Cloud)
# ─────────────────────────────────────────────────────────────────────────────

  - name: ClickHouse Cloud host
    phase: 2
    env: CLICKHOUSE_CLOUD_HOST
    value: ""
    input: config
    console: https://clickhouse.cloud → service → Connect
    notes: "Format: <service-id>.<region>.aws.clickhouse.cloud (port 8443, HTTPS)."
    owner: ""
    rotates: never

  - name: ClickHouse Cloud user
    phase: 2
    env: CLICKHOUSE_CLOUD_USER
    value: ""
    input: config
    console: https://clickhouse.cloud → service → Settings → Users
    scopes: [SELECT]
    notes: >-
      Create a dedicated READ-ONLY user for the MCP server. An agent with a
      tool has the user's full grants — do not reuse the admin account.
    owner: ""
    rotates: 90d

  - name: ClickHouse Cloud password
    phase: 2
    env: CLICKHOUSE_CLOUD_PASSWORD
    value: ""
    console: https://clickhouse.cloud → service → Settings → Users
    notes: Shown once at user creation. Pairs with the user above.
    owner: ""
    rotates: 90d

  - name: MCP ClickHouse server URL
    phase: 2
    env: MCP_CLICKHOUSE_URL
    value: ""
    input: config
    console: self-hosted
    notes: SSE endpoint of the MCP server, e.g. http://mcp-clickhouse:9100/sse
    owner: ""
    rotates: never

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 1 — image generation (free tier)
#  HuggingFace FLUX.1-schnell (primary) + Cloudflare Workers AI (fallback).
#  Both are optional — image generation in LibreChat is silently disabled if
#  neither token is set.
# ─────────────────────────────────────────────────────────────────────────────

  - name: Hugging Face token
    phase: 1
    env: HF_TOKEN
    value: ""
    input: external
    console: https://huggingface.co/settings/tokens
    scopes: [read]
    notes: >-
      Phase 1: primary image generation provider (FLUX.1-schnell, free tier).
      Phase 3: also needed for gated model weights (Llama, some EXAONE
      variants). Qwen2.5 is open and needs no token.
    owner: ""
    rotates: 180d

  - name: Cloudflare API token
    phase: 1
    env: CF_API_TOKEN
    value: ""
    input: external
    console: "https://dash.cloudflare.com/ → My Profile → API Tokens → Create Token → Cloudflare Workers AI template"
    scopes: [ai.run]
    notes: >-
      Fallback image generation provider (FLUX.1-schnell via Workers AI).
      Free tier: 10,000 neurons per day. LiteLLM automatically falls back
      to this when HuggingFace is rate-limited or unavailable.
    owner: ""
    rotates: 90d

  - name: Cloudflare account ID
    phase: 1
    env: CF_ACCOUNT_ID
    value: ""
    input: config
    console: "https://dash.cloudflare.com/ → account name top-right → Account ID"
    notes: >-
      Not a secret — visible on the Cloudflare dashboard. Required alongside
      CF_API_TOKEN for Workers AI routing.
    owner: ""
    rotates: n/a

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 3 — self-hosted serving (RunPod)
# ─────────────────────────────────────────────────────────────────────────────

  - name: RunPod API key
    phase: 3
    env: RUNPOD_API_KEY
    value: ""
    console: https://www.runpod.io/console/user/settings → API Keys
    scopes: [pod.read, pod.write]
    notes: >-
      Only needed to create/stop pods programmatically. Deploying by hand in
      the console requires no key at all.
    owner: ""
    rotates: 90d

  - name: vLLM endpoint (RunPod proxy)
    phase: 3
    env: VLLM_API_BASE
    value: ""
    input: config
    console: https://www.runpod.io/console/pods → pod → Connect
    notes: >-
      Must include the /v1 suffix:
      https://<pod-id>-8000.proxy.runpod.net/v1
      Changes every time the pod is recreated.
    owner: ""
    rotates: per-pod

  - name: vLLM API key
    phase: 3
    env: VLLM_API_KEY
    value: ""
    console: self-generated
    generate: hex-24
    notes: >-
      Passed to `vllm serve --api-key`. The RunPod HTTP proxy is public by
      default, so an unauthenticated pod is an open GPU to the internet.
      Always set this.
    owner: ""
    rotates: per-pod


  - name: Cloudflare API token
    phase: 1
    env: CF_API_TOKEN
    value: ""
    input: external
    console: "https://dash.cloudflare.com/ → My Profile → API Tokens → Create Token → Cloudflare Workers AI template"
    scopes: [ai.run]
    notes: >-
      Used by LiteLLM for Cloudflare Workers AI image generation (FLUX.1-schnell).
      Free tier: 10,000 neurons per day.
    owner: ""
    rotates: 90d

  - name: Cloudflare account ID
    phase: 1
    env: CF_ACCOUNT_ID
    value: ""
    input: config
    console: "https://dash.cloudflare.com/ → top-right Account ID"
    notes: >-
      Not a secret — visible on the Cloudflare dashboard. Required by LiteLLM
      alongside CF_API_TOKEN to route image generation requests.
    owner: ""
    rotates: n/a

  # ── AWS (target: aws-ec2) ──
  #  PREFER IAM Identity Center / SSO or an instance profile over static keys.
  #  Set AWS_PROFILE and leave the two static keys blank if you can.
  - name: AWS profile
    phase: 3
    env: AWS_PROFILE
    value: ""
    input: config
    bootstrap_target: aws-ec2
    console: "aws configure sso"
    notes: >-
      The safe path. If this is set, leave AWS_ACCESS_KEY_ID and
      AWS_SECRET_ACCESS_KEY blank — Terraform picks up the profile.
    owner: ""
    rotates: n/a

  - name: AWS access key ID
    phase: 3
    env: AWS_ACCESS_KEY_ID
    value: ""
    bootstrap_target: aws-ec2
    required: false
    console: https://console.aws.amazon.com/iam → Users → Security credentials
    notes: >-
      Static long-lived credential — least preferred. Use only if SSO is
      unavailable. Scope the IAM user to EC2/VPC/EIP for this project alone.
    owner: ""
    rotates: 90d

  - name: AWS secret access key
    phase: 3
    env: AWS_SECRET_ACCESS_KEY
    value: ""
    bootstrap_target: aws-ec2
    required: false
    console: https://console.aws.amazon.com/iam → Users → Security credentials
    notes: Shown once at creation. Pairs with the access key ID above.
    owner: ""
    rotates: 90d

  - name: AWS region
    phase: 3
    env: AWS_REGION
    value: "ap-northeast-2"
    input: default
    console: n/a
    notes: Must match targets.aws-ec2.vars.region in stack.yaml.
    owner: ""
    rotates: never

  - name: AWS EC2 key pair name
    phase: 3
    env: AWS_KEY_NAME
    value: ""
    input: config
    console: https://console.aws.amazon.com/ec2 → Key Pairs
    notes: >-
      Name only, not the .pem contents. Keep the private key outside this
      repo entirely (~/.ssh/). Passed as --tf-var key_name=<name>.
    owner: ""
    rotates: never

  - name: Allowed inbound CIDR
    phase: 3
    env: AWS_ALLOWED_CIDR
    value: ""
    input: config
    console: n/a
    notes: >-
      Your IP as <ip>/32. NEVER 0.0.0.0/0 — this stack holds live provider
      keys behind unauthenticated-by-default ports.
    owner: ""
    rotates: as-needed

# ─────────────────────────────────────────────────────────────────────────────
#  Phase 4 — artifact storage and memory
# ─────────────────────────────────────────────────────────────────────────────

  - name: Artifact MinIO root user
    phase: 4
    env: ARTIFACT_MINIO_ROOT_USER
    value: ""
    console: self-generated
    generate: identifier-12
    default_credential: id
    notes: Separate instance from the Langfuse blob store (ports 9011/9012).
    owner: ""
    rotates: never

  - name: Artifact MinIO root password
    phase: 4
    env: ARTIFACT_MINIO_ROOT_PASSWORD
    value: ""
    console: self-generated
    generate: hex-16
    default_credential: password
    notes: Datasets, eval artifacts, model weights.
    owner: ""
    rotates: 180d

