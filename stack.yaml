# ═════════════════════════════════════════════════════════════════════════════
#  Sovereign AI Stack — single source of truth
# ═════════════════════════════════════════════════════════════════════════════
#
#  This file describes WHAT the stack is. It says nothing about WHERE it runs.
#  The deployment target is selected at run time by the script:
#
#      ./scripts/stack.sh up --target docker  --profile full
#      ./scripts/stack.sh up --target aws-ec2 --profile phase-1
#
#  Secrets are NEVER stored here — only the NAMES of the env vars that hold
#  them (`*_env` keys). Values live in .env; see .env.example.
#
#  Rendered artifacts (docker/litellm_config.yaml, docker/librechat.yaml) are
#  generated from the `models` catalog below by `stack.sh render`. Do not edit
#  them by hand — edit this file and re-render.
#
# ═════════════════════════════════════════════════════════════════════════════

schema: 1

project:
  name: llmops-in-a-box
  slug: sais                    # compose project name (-p) and cloud resource
                                # prefix. Not derived from `name`, and changing
                                # it renames every container, network, and
                                # volume — existing local data is orphaned.
  environment: demo             # demo | staging | prod
  owner: ken.lee@clickhouse.com

# ─────────────────────────────────────────────────────────────────────────────
#  Build-out phases — the order this stack is actually being built.
#
#  Each phase has a matching profile below, so `--profile phase-1` brings up
#  exactly the scope of that phase and nothing more. `current` is what the
#  default profile tracks; bump it as each phase lands.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  current: 1
  1:
    name: Frontier models
    status: in_progress
    scope: >-
      LiteLLM gateway + Langfuse observability + LibreChat, OpenAI and
      Anthropic models only. No GPU, no self-hosting.
    adds_layers: [gateway, observability, ui]
    adds_models: [claude-sonnet]
  2:
    name: MCP tool layer
    status: not_built
    scope: >-
      MCP servers exposed to the gateway so tool-use is traced through the
      same pipeline. First server is ClickHouse Cloud — settled, not a
      shortlist.
    adds_layers: [tools]
    adds_models: []
  3:
    name: CPU serving and MinIO KV cache
    status: not_built
    scope: >-
      llama.cpp serving a quantized model on the EC2 instance's own CPUs — no
      GPU pod required — alongside MinIO AIStor for datasets and model weights,
      and LMCache writing the transformer KV cache to MinIO S3. Runs entirely
      on existing EC2 infrastructure; no external service needed.
    adds_layers: [cpu, storage, kvcache]
    adds_models: [qwen-0.5b]
  4:
    name: GPU serving on RunPod
    status: not_built
    scope: >-
      vLLM on a RunPod GPU pod behind the same gateway, so self-hosted GPU and
      CPU models sit side by side in one Langfuse project alongside the
      commercial APIs.
    adds_layers: [serving]
    adds_models: [qwen-7b]
  5:
    name: Operating recipes
    status: not_built
    scope: >-
      No new layers. Context-based routing in LiteLLM, LibreChat Agents over
      the Phase 2 MCP tools, Langfuse evaluations, gateway guardrails, and
      finally judge-scored routing — aggregate judge scores feeding back into
      where requests go. That loop is the destination Phases 1-4 exist to make
      possible: it needs one point that both measures a request and decides
      its route.
    adds_layers: []
    adds_models: []

# ─────────────────────────────────────────────────────────────────────────────
#  Defaults used when the CLI flags are omitted.
#  Tracks phases.current — Phase 1 is frontier APIs, so no GPU is required to
#  bring the stack up today.
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  target: docker      # Phase 1 only; use --target aws-ec2 for Phase 2+
  profile: phase-1

# ─────────────────────────────────────────────────────────────────────────────
#  Profiles — named presets selecting which layers and models come up.
#
#  `layers`: layer keys to enable (transitive `requires` are added automatically)
#  `models`: model aliases to expose; omit the key entirely to expose all
#            models whose `enabled: true`.
#
#  The phase-N profiles are cumulative: phase-3 includes everything phase-1 and
#  phase-2 brought up.
# ─────────────────────────────────────────────────────────────────────────────
profiles:

  # ── Phase 1 (current) — frontier APIs only. No GPU pod needed. ──
  phase-1:
    description: "Phase 1 — frontier models (OpenAI + Anthropic), no self-hosting"
    layers: [gateway, observability, ui]
    models: [claude-sonnet]

  # ── Phase 2 — add the MCP tool layer (ClickHouse Cloud first). ──
  phase-2:
    description: "Phase 2 — Phase 1 plus the MCP tool layer"
    layers: [gateway, observability, ui, tools]
    models: [claude-sonnet]

  # ── Phase 3 — CPU serving + MinIO KV cache. Runs on existing EC2. ──
  phase-3:
    description: "Phase 3 — Phase 2 plus CPU serving and MinIO KV cache"
    layers: [gateway, observability, ui, tools, cpu, storage, kvcache]

  # ── Phase 4 — add GPU serving (RunPod) alongside the CPU path. ──
  #    Cumulative over Phase 3. `serving` (RunPod) requires VLLM_API_BASE;
  #    the resolver skips it if unset, so Phase 3 layers continue to work.
  phase-4:
    description: "Phase 4 — Phase 3 plus GPU serving on RunPod"
    layers: [gateway, observability, ui, tools, cpu, storage, kvcache, serving]

  # ── Phase 5 — operating recipes. Same layers as Phase 4 by design: these
  #    are things to *do* with the stack, not things to add to it. ──
  phase-5:
    description: "Phase 5 — Phase 4 plus operating recipes (no new layers)"
    layers: [gateway, observability, ui, tools, cpu, storage, kvcache, serving]

  # ── Convenience aliases, independent of phase ──

  # Everything currently implemented, whatever phase that is.
  # `memory` is deliberately NOT listed — not "not built yet", blocked on
  # NVIDIA STX hardware with no GA date. See layers.memory.
  full:
    description: Every layer whose `enabled` is true
    layers: [gateway, observability, ui, tools, cpu, storage, kvcache, serving]

  # Gateway + traces, no chat UI. For SDK / script-driven demos.
  headless:
    description: Gateway and observability only, no UI
    layers: [gateway, observability]

  # Nothing leaves the network boundary. Requires Phase 3 (CPU).
  # CPU serving (llama.cpp on EC2) is more truly airgapped than RunPod, which
  # requires an outbound connection to the RunPod API.
  airgapped:
    description: Self-hosted models only — no egress to commercial APIs
    layers: [gateway, observability, ui, cpu]
    models: [qwen-0.5b]

# ─────────────────────────────────────────────────────────────────────────────
#  Deployment targets — selected with `--target`, never hard-coded in configs.
# ─────────────────────────────────────────────────────────────────────────────
targets:

  docker:
    kind: compose
    description: >-
      Phase 1 development target — local Docker Compose. Phase 2 and above
      require the aws-ec2 target: CPU inference is impractically slow on a
      laptop, and RunPod (Phase 4) is already an external service. Use
      `docker` to iterate on Phase 1; use `aws-ec2` for everything else.
    compose_file: docker/docker-compose.yml
    env_file: .env
    host: localhost
    supported_phases: [1]

  aws-ec2:
    kind: terraform
    description: >-
      Primary deployment target for Phase 2 and above. Single EC2 instance
      bootstrapped with the same compose stack; same commands as `docker`,
      different `--target` flag.
    dir: terraform
    host: null                  # resolved from the `public_ip` terraform output
    # Same five phases as `docker`. Phase 3's CPU serving runs on this instance,
    # so its KV cache uses the local MinIO S3 bucket natively. Phase 4's GPU KV
    # cache stays pod-local (RunPod cannot reach this host without latency
    # defeating the purpose). See layers.kvcache.
    supported_phases: [1, 2, 3, 4, 5]
    notes:
      3: >-
        CPU serving (llama.cpp) runs on the EC2 instance. KV-cache offload uses
        the instance's own MinIO bucket — no external connection required.
      4: >-
        Requires VLLM_API_BASE pointing at a live RunPod pod. GPU KV cache stays
        pod-local — do not route it to this instance's MinIO over the internet.
    vars:
      instance_type: t3.xlarge
      volume_size_gb: 100
      volume_type: gp3
      region: ap-northeast-2
      ssm_path_prefix: /sais/phase-1
      # key_name and allowed_cidr have no safe default — pass them explicitly:
      #   ./scripts/stack.sh up --target aws-ec2 \
      #       --tf-var key_name=my-keypair --tf-var allowed_cidr=1.2.3.4/32
    # Optional: configure a custom domain for automatic HTTPS via Caddy.
    # Values here are overridden by DOMAIN_BASE / DOMAIN_SSL_EMAIL env vars.
    # Run `./scripts/stack.sh secrets domain` to set them interactively.
    domain:
      base: ""             # e.g. example.com  (overridden by DOMAIN_BASE)
      ssl_email: ""        # Let's Encrypt contact (overridden by DOMAIN_SSL_EMAIL)
      subdomains:
        litellm: litellm   # litellm.example.com
        langfuse: langfuse # langfuse.example.com
        librechat: chat    # chat.example.com

  k8s:
    kind: helm
    description: Helm-based production deployment
    enabled: false              # roadmap — the script refuses this target
    dir: charts

# ─────────────────────────────────────────────────────────────────────────────
#  Layers — the fixed architecture. Implementations are swappable.
#
#  phase           : which build-out phase introduces this layer
#  enabled         : false = declared but not wired up in this repo yet
#  compose_profile : docker compose profile that starts this layer (null if the
#                    layer is not a compose service)
#  managed_by      : compose | runpod | external — who owns the lifecycle
#  requires        : other layer keys this one cannot run without
# ─────────────────────────────────────────────────────────────────────────────
layers:

  gateway:
    phase: 1
    enabled: true
    impl: litellm
    managed_by: compose
    compose_profile: gateway
    image: ghcr.io/berriai/litellm:main-stable
    port: 4000
    requires: []
    options:
      master_key_env: LITELLM_MASTER_KEY
      num_retries: 0        # retry on the same model before fallback — 0 means go straight to fallback
      request_timeout_s: 5  # per-request timeout; fallback triggers immediately on 429/5xx
      drop_params: true         # tolerate params a given provider doesn't accept
      callbacks:
        success: [langfuse]
        failure: [langfuse]
      default_tags: [llmops-in-a-box]
      language_routing:
        # Automatic language detection routes requests before they reach the
        # model. The callback (docker/litellm_callbacks.py) inspects the last
        # user message and rewrites the model field based on Unicode script:
        #   - Hangul-primary (Korean)           → multilingual_model (claude-sonnet)
        #   - CJK/kana-primary (Chinese/Japanese) → cjk_model (qwen-7b, RunPod)
        #   - Latin-primary (English, etc.)     → english_model (qwen-7b, RunPod)
        # Routing decisions are tagged as metadata on every Langfuse trace:
        #   detected_script: hangul | cjk | latin | image
        #   routed_model:    the alias actually used
        # Clients that explicitly request a model are not affected.
        # The threshold is the fraction of characters in a script required
        # to classify a message; checked Hangul-first, then CJK.
        enabled: true
        english_model: qwen-7b
        multilingual_model: claude-sonnet
        cjk_model: qwen-7b
        threshold: 0.15
      routing:
        strategy: simple-shuffle
        # qwen-7b falls back to claude-sonnet when the self-hosted pod is cold or down.
        fallbacks:
          - from: qwen-7b
            to: [claude-sonnet]
          - from: auto
            to: [claude-sonnet]
      image_generation:
        enabled: true
        # LibreChat requests this model name for image generation.
        # The UnifiedRouter callback calls Cloudflare Workers AI directly.
        dalle_alias: dall-e-3
        # Image generation takes 10-60 s. Override the global request_timeout_s
        # (5 s for chat) so these models are not killed mid-generation.
        timeout: 90
        providers:
          cloudflare:
            model: "@cf/black-forest-labs/flux-1-schnell"
            api_key_env: CF_API_TOKEN
            account_id_env: CF_ACCOUNT_ID
      budget:
        max_budget_usd: 50
        duration: 30d

  observability:
    phase: 1
    enabled: true
    impl: langfuse
    managed_by: compose
    compose_profile: obs
    image: langfuse/langfuse:3
    port: 3000
    requires: []
    options:
      public_key_env: LANGFUSE_PUBLIC_KEY
      secret_key_env: LANGFUSE_SECRET_KEY
      trace_sample_rate: 1.0
      # Langfuse v3 needs all four of these. They are internal dependencies of
      # this layer and come up with it on the `obs` compose profile — they are
      # NOT the Phase 4 `storage` layer, which is a separate, user-facing
      # artifact store that happens to also be MinIO.
      backends:
        clickhouse:
          managed_by: clickhouse-cloud
          database: llmops
          role: OLAP trace storage — ClickHouse Cloud, not a local container
        postgres:
          image: postgres:16-alpine
          ports: { tcp: 5432 }
          role: metadata, users, projects
        redis:
          image: redis:7-alpine
          ports: { tcp: 6379 }
          role: queue and cache
        minio:
          image: minio/minio:latest
          ports: { api: 9002, console: 9001 }
          role: S3-compatible blob store for Langfuse event uploads
          buckets: [langfuse]

  ui:
    phase: 1
    enabled: true
    impl: librechat
    managed_by: compose
    compose_profile: ui
    image: ghcr.io/danny-avila/librechat:latest
    port: 3080
    requires: [gateway]
    options:
      endpoint_label: Sovereign AI Stack
      allow_registration: true
      title_model: claude-sonnet  # model used to auto-title conversations
      # Reached over the compose network, not via localhost.
      gateway_internal_url: http://litellm:4000/v1
      # Models exposed in the LibreChat picker. When language_routing is enabled
      # the gateway handles model selection transparently, so only "auto" is
      # needed here. Override to expose individual aliases if required.
      exposed_models:
        - auto

  serving:
    phase: 4
    # Nothing to scaffold in this repo — the endpoint is provisioned in the
    # RunPod console (Serverless → New Endpoint → vLLM worker template), so
    # this stays `true` and `--profile phase-4` works as soon as VLLM_API_BASE
    # points at a live serverless endpoint.
    enabled: true
    impl: vllm
    managed_by: runpod          # NOT a compose service — RunPod Serverless
    compose_profile: null
    port: 8000
    requires: []
    options:
      api_base_env: VLLM_API_BASE   # https://api.runpod.ai/v2/{endpoint_id}/openai/v1
      api_key_env: VLLM_API_KEY     # RunPod API key
      deployment: serverless        # cost-optimised; workers spin up on demand
      gpu_min: RTX 3090             # minimum tier for a 7B bfloat16 model (~24 GiB VRAM)
      model_id: Qwen/Qwen2.5-7B-Instruct
      max_model_len: 32768
      dtype: bfloat16
      alternatives:
        - LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct   # Korean workloads
        - yanolja/EEVE-Korean-Instruct-10.8B-v1.0

  # ── Phase 2 — MCP tool layer ──
  tools:
    phase: 2
    enabled: true
    impl: mcp
    managed_by: compose
    compose_profile: tools
    port: 9100
    requires: [gateway]
    options:
      # ClickHouse Cloud: agents can query the warehouse and every tool call
      # is traced through the same LiteLLM → Langfuse path.
      servers:
        - name: clickhouse
          enabled: true
          transport: sse
          url_env: MCP_CLICKHOUSE_URL
          credentials_env: [CLICKHOUSE_CLOUD_HOST, CLICKHOUSE_CLOUD_USER, CLICKHOUSE_CLOUD_PASSWORD]
          scopes: [read_only]

  # ── Phase 4 — user-facing artifact store (distinct from Langfuse's blob
  #    store above: datasets, eval artifacts, model weights).
  #
  #    Licensing: MinIO AIStor Free is single-node with no artificial capacity
  #    limit, and includes erasure coding and bitrot protection — so this whole
  #    layer costs nothing at the scale this stack runs at. The threshold is
  #    node count, not terabytes: going multi-node moves you to Enterprise Lite
  #    (under 400 TiB) or Enterprise. Single node is the right scope for a
  #    reference architecture that is explicitly not a production data
  #    platform. ──
  storage:
    phase: 3
    enabled: false
    impl: minio-aistor
    managed_by: compose
    compose_profile: storage
    port: 9011                  # console; API on 9012 — avoids the Langfuse
    requires: []                # MinIO on 9001/9002
    options:
      api_port: 9012
      # `kvcache` is here because this one instance serves two roles: the
      # user-facing artifact store, and the S3 backend for `kvcache` below when
      # vLLM runs locally. One container, two jobs.
      buckets: [datasets, artifacts, weights, kvcache]

  # ── Phase 3 — KV-cache reuse via LMCache. ──
  #
  #  Not a container. LMCache runs in-process with the inference engine, so
  #  this layer's lifecycle follows whichever serving layer is active.
  #
  #  Backend is decided per serving path:
  #
  #    Phase 3 — CPU serving (llama.cpp, local compose) → s3
  #      The `storage` layer's MinIO S3 bucket (`kvcache`). Local, so no
  #      network penalty. This is the primary KV-cache path for Phase 3.
  #
  #    Phase 4 — GPU serving (RunPod, remote) → pod-local
  #      CPU RAM + NVMe on the GPU pod. Do NOT point a remote pod at the
  #      EC2 instance's object store: 2-16 MB KV blocks over an internet hop
  #      are slower than recomputing prefill. Blocks are also derived from
  #      prompts — routing them through a tunnel contradicts sovereignty.
  kvcache:
    phase: 3
    enabled: false
    impl: lmcache
    managed_by: follows-serving
    compose_profile: null
    requires: []                # follows whichever of `serving` or `cpu` is active
    options:
      # vLLM's built-in prefix caching is the first step and is useful alone,
      # in GPU memory, with no backend at all.
      prefix_caching: true
      backend_by_serving:
        runpod: pod-local       # Phase 3: GPU pod, KV blocks stay on pod
        compose: s3             # Phase 4: CPU serving in compose, MinIO S3
      s3_bucket: kvcache

  # ── Phase 3 — CPU-based local inference via llama.cpp. ──
  #
  #  llama.cpp server runs as a compose service on the EC2 instance's own CPUs.
  #  Exposes an OpenAI-compatible endpoint on port 8080 (Docker network only).
  #  No GPU pod required — runs on the instance's 4 vCPUs and 16 GiB RAM.
  #
  #  Model: Qwen2.5-0.5B-Instruct (Q4_K_M GGUF, ~0.4 GiB). Small enough to
  #  leave headroom for the rest of the stack. Larger models (1.5B, 3B) work
  #  if the instance type is upgraded.
  #
  #  KV-cache offload: LMCache running in-process with llama.cpp writes
  #  transformer KV blocks to the `storage` layer's MinIO S3 `kvcache` bucket.
  #  This is the `compose: s3` path in kvcache.options.backend_by_serving.
  cpu:
    phase: 3
    enabled: false
    impl: llama-cpp
    managed_by: compose
    compose_profile: cpu
    port: 8080
    requires: [gateway, storage]
    options:
      model: Qwen/Qwen2.5-0.5B-Instruct
      quantization: Q4_K_M
      context_window: 32768
      n_threads: 4              # t3.xlarge has 4 vCPUs
      n_gpu_layers: 0           # CPU only — no GPU offload
      kvcache_backend: s3       # LMCache → MinIO (storage layer, kvcache bucket)
      s3_bucket: kvcache

  # ── NOT IN ANY PHASE — blocked on hardware. Read before enabling. ──
  #
  #  MinIO MemKV is a purpose-built context memory store for AI inference — a
  #  petascale, flash-backed pool for the transformer KV cache. It moves
  #  attention key/value blocks from GPU memory to NVMe over RDMA in 2-16 MB
  #  blocks, bypassing file system and object protocols. Targets TTFT and TPOT
  #  at fleet scale.
  #
  #  Hardware required: NVIDIA STX-based systems, Vera CPUs, Spectrum-X 800 GbE,
  #  PCIe Gen6. No compose service, no RunPod pod, no GA date.
  #  Only calls to action are "Talk to a Specialist" and "Get Pricing".
  #
  #  The buildable KV-cache path is the `cpu` + `kvcache` + `storage` combo in
  #  Phase 4: llama.cpp (CPU) + LMCache + MinIO S3. Different mechanism —
  #  open-source, runs today — but the architectural principle is the same:
  #  KV blocks written to an S3-compatible store instead of recomputed.
  #
  #  DECIDED: stays a plan. Not scheduled, in no phase, in no profile.
  #  Kept declared so the architecture has an honest answer for what happens
  #  to KV cache at fleet scale, and so nobody reads this layer as one
  #  `enabled: true` away from working.
  memory:
    phase: null                 # was 4 — see above
    enabled: false
    impl: memkv
    managed_by: compose
    compose_profile: memory
    port: 9200
    requires: [gateway]         # wrong for KV-cache offload: it sits under
                                # the inference engine, not beside the gateway
    options:
      # These two describe a semantic cache, NOT MemKV. Kept verbatim so the
      # mismatch stays visible instead of being quietly deleted.
      semantic_cache: true
      similarity_threshold: 0.95

# ─────────────────────────────────────────────────────────────────────────────
#  Model catalog — the ONE place models are defined.
#
#  Renders into:
#    • docker/litellm_config.yaml  → model_list (routing + cost attribution)
#    • docker/librechat.yaml       → the UI model picker
#
#  cost_per_1k is in USD per 1,000 tokens (human-readable); the renderer
#  converts to LiteLLM's per-token fields. Set 0 for self-hosted so Langfuse
#  shows API spend against a zero-marginal-cost baseline.
# ─────────────────────────────────────────────────────────────────────────────
models:

  - alias: qwen-7b
    phase: 4
    enabled: true
    tier: self_hosted
    provider: vllm
    litellm_model: openai/Qwen/Qwen2.5-7B-Instruct
    api_base_env: VLLM_API_BASE
    api_key_env: VLLM_API_KEY
    context_window: 32768
    cost_per_1k: { input: 0.0, output: 0.0 }
    rate_limit: { rpm: 60, tpm: 200000 }
    timeout_s: 600              # serverless cold start: allow up to 10 min for warm-up + inference
    ui:
      label: Qwen2.5 7B — GPU
      description: Runs on a RunPod GPU pod. No data leaves the boundary.

  - alias: qwen-0.5b
    phase: 3
    enabled: true
    tier: self_hosted
    provider: llama-cpp
    litellm_model: openai/Qwen/Qwen2.5-0.5B-Instruct
    api_base_env: LLAMA_CPP_API_BASE
    context_window: 32768
    cost_per_1k: { input: 0.0, output: 0.0 }
    rate_limit: { rpm: 30, tpm: 100000 }
    ui:
      label: Qwen2.5 0.5B — CPU
      description: Runs on EC2 CPU. No GPU required, no data leaves the boundary.

  - alias: gpt-4o
    phase: 1
    enabled: false
    tier: commercial
    provider: openai
    litellm_model: openai/gpt-4o
    api_key_env: OPENAI_API_KEY
    context_window: 128000
    cost_per_1k: { input: 0.0025, output: 0.01 }
    rate_limit: { rpm: 500, tpm: 800000 }
    ui:
      label: GPT-4o
      description: OpenAI commercial API.

  - alias: claude-sonnet
    phase: 1
    enabled: true
    tier: commercial
    provider: anthropic
    litellm_model: anthropic/claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    context_window: 200000
    cost_per_1k: { input: 0.003, output: 0.015 }
    rate_limit: { rpm: 500, tpm: 400000 }
    ui:
      label: Claude Sonnet 4.5
      description: Anthropic commercial API, format-translated by LiteLLM.

# ─────────────────────────────────────────────────────────────────────────────
#  Secrets — names only. `stack.sh doctor` verifies these are set in .env.
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  provider: dotenv              # dotenv | aws-ssm | vault
  file: .env
  required:
    - LITELLM_MASTER_KEY
    - LITELLM_SALT_KEY
  # Missing optional secrets produce a warning and disable the models/layers
  # that need them, rather than failing the deploy.
  #
  # Keyed by phase: `doctor` only checks phases up to the highest phase the
  # selected profile actually needs, so Phase 1 output stays quiet about
  # RunPod and MCP credentials you do not have yet. Use --all to see them.
  optional:
    1:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - LANGFUSE_EE_LICENSE_KEY
      - NEXTAUTH_SECRET
      - LANGFUSE_SALT
      # Langfuse v4 requires both of these in addition to SALT. ENCRYPTION_KEY
      # is 256-bit hex (openssl rand -hex 32) and encrypts stored provider
      # credentials — losing it makes existing rows unreadable. REDIS_AUTH must
      # match the password redis-server is started with; Langfuse has no
      # unauthenticated Redis mode in its compose topology.
      - LANGFUSE_ENCRYPTION_KEY
      - REDIS_AUTH
      # Headless initialization seeds the org, project and API key pair from
      # the variables above. Without these two it stops short of a login
      # account, and someone has to register through the UI on first visit —
      # which is the manual step the whole approach exists to remove.
      - LANGFUSE_INIT_USER_EMAIL
      - LANGFUSE_INIT_USER_NAME
      - LANGFUSE_INIT_USER_PASSWORD
      - UI_USERNAME
      - UI_PASSWORD
      # Langfuse → ClickHouse Cloud (llmops database).
      # CLICKHOUSE_CLOUD_HOST: hostname only, no port (e.g. abc.clickhouse.cloud).
      # Create writer on ClickHouse Cloud: CREATE USER langfuse_writer IDENTIFIED BY '...';
      #                                    GRANT ALL ON llmops.* TO langfuse_writer;
      - CLICKHOUSE_CLOUD_HOST
      - LANGFUSE_CLICKHOUSE_USER
      - LANGFUSE_CLICKHOUSE_PASSWORD
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - LIBRECHAT_CREDS_KEY
      - LIBRECHAT_CREDS_IV
      - LIBRECHAT_JWT_SECRET
      - LIBRECHAT_JWT_REFRESH_SECRET
      # SMTP — Langfuse invitation and password-reset emails.
      # Uses Gmail App Password or any SMTP provider.
      - LANGFUSE_EMAIL_HOST
      - LANGFUSE_EMAIL_PORT
      - LANGFUSE_EMAIL_USER
      - LANGFUSE_EMAIL_PASSWORD
      - LANGFUSE_EMAIL_FROM
      # Image generation — Cloudflare Workers AI (free tier).
      # CF:  https://dash.cloudflare.com/ → API Tokens → "Cloudflare Workers AI" template
      #      CF_ACCOUNT_ID: top-right of the Cloudflare dashboard
      - CF_API_TOKEN
      - CF_ACCOUNT_ID
      # Domain / HTTPS proxy — aws-ec2 target only.
      # Set interactively: ./scripts/stack.sh secrets domain
      - DOMAIN_BASE
      - DOMAIN_SSL_EMAIL
    2:
      - MCP_CLICKHOUSE_URL
      - CLICKHOUSE_CLOUD_USER
      - CLICKHOUSE_CLOUD_PASSWORD
    3:
      - ARTIFACT_MINIO_ROOT_USER
      - ARTIFACT_MINIO_ROOT_PASSWORD
    4:
      - VLLM_API_BASE
      - VLLM_API_KEY

# ─────────────────────────────────────────────────────────────────────────────
#  Render targets for the model catalog.
# ─────────────────────────────────────────────────────────────────────────────
render:
  banner: >-
    GENERATED by scripts/stack.sh render — DO NOT EDIT.
    Edit stack.yaml and re-run `./scripts/stack.sh render`.
  files:
    litellm: docker/litellm_config.yaml
    librechat: docker/librechat.yaml
    caddy: docker/caddy/Caddyfile

# ─────────────────────────────────────────────────────────────────────────────
#  Health checks — {{host}} is substituted from the resolved target.
#  Used by `stack.sh status`. Checks for disabled layers are skipped.
# ─────────────────────────────────────────────────────────────────────────────
health:
  timeout_s: 5
  checks:
    - name: litellm
      layer: gateway
      url: http://{{host}}:4000/health/liveliness
    - name: langfuse
      layer: observability
      url: http://{{host}}:3000/api/public/health
    - name: librechat
      layer: ui
      url: http://{{host}}:3080/health
    # ClickHouse is now ClickHouse Cloud — no local health endpoint to check.
    - name: langfuse-minio
      layer: observability
      url: http://{{host}}:9002/minio/health/live
    - name: mcp
      layer: tools
      url: http://{{host}}:9100/health
    - name: vllm
      layer: serving
      url: "{{VLLM_API_BASE}}/models"
    - name: artifact-minio
      layer: storage
      url: http://{{host}}:9012/minio/health/live
    # Placeholder, and known wrong — MemKV is not an HTTP service on this host.
    # Left alongside the layer it belongs to rather than deleted, so the two
    # get corrected together once the memory layer is resolved. See
    # layers.memory.
    - name: memkv
      layer: memory
      url: http://{{host}}:9200/health
