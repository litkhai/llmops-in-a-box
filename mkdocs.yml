site_name: LLMOPS In a Box
site_description: >-
  Sovereign AI Stack — a composable, self-hosted enterprise AI stack: model
  serving, unified gateway, chat UI, and full-stack observability.
site_url: https://litkhai.github.io/llmops-in-a-box/
site_author: Kee Hoon Lee

repo_url: https://github.com/litkhai/llmops-in-a-box
repo_name: litkhai/llmops-in-a-box
edit_uri: edit/main/docs/

copyright: MIT licensed. Built on open infrastructure.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  # Dark first — this reads as a product site rather than a wiki. Light mode
  # stays fully supported; both are tuned in stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    # The nav is grouped into sections, so tabs show the four sections and the
    # left sidebar shows the pages inside the active one. Those are different
    # lists, which is what stops the sidebar from being a second copy of the
    # tabs — the problem a flat nav had. Only index.md hides the sidebar, being
    # a landing page with nothing to sit beside it.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # Folds the page's own headings into the left sidebar instead of a second
    # column on the right. One navigation surface rather than two, and the
    # content takes back the width the right column used.
    - toc.integrate

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Understand:
      - Background: background.md
      - Build-out phases: phases.md
  - Build:
      - Workshop: workshop.md
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Credentials: credentials.md
  - Present:
      - Demo flow: demo-flow.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 3, not 4. With toc.integrate the contents live in the left sidebar, and
      # at depth 4 every "The deliverable" and "The trace shape" landed there
      # too — the same label repeated down the column is what made it hard to
      # scan. Depth 3 stops at the phase headings, which is the level anyone is
      # actually navigating by.
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/litkhai/llmops-in-a-box
      name: Source on GitHub
  generator: false

# Fail the build on a broken internal link rather than shipping it.
strict: true
